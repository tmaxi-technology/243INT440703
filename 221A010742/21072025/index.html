<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <div class="calculator">
        <input type="text" id="display" value="0" readonly>
        <table>
            <tr>
                <td>MC</td>
                <td>MR</td>
                <td>M+</td>
                <td>M-</td>
            </tr>
            <tr>
                <td class="phepTinh">%</td>
                <td class="phepTinh">CE</td>
                <td class="phepTinh">C</td>
                <td class="phepTinh">x</td>
            </tr>
            <tr>
                <td class="phepTinh">1/x</td>
                <td class="phepTinh">x²</td>
                <td class="phepTinh">²√x</td>
                <td class="phepTinh">/</td>
            </tr>
            <tr>
                <td>7</td>
                <td>8</td>
                <td>9</td>
                <td class="phepTinh">*</td>
            </tr>
            <tr>
                <td>4</td>
                <td>5</td>
                <td>6</td>
                <td class="phepTinh">-</td>
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td class="phepTinh">+</td>
            </tr>
            <tr>
                <td>+/-</td>
                <td>0</td>
                <td>.</td>
                <td class="phepTinh">=</td>
            </tr>
        </table>
    </div>
</body>
</html>
