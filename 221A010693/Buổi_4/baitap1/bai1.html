<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Máy tính</title>
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
    <h1>Calculator</h1>
    <div class="calculator">
        <input type="text" id="display" value="0" disabled />
        <div class="buttons">
            <!-- Hàng 1 -->
            <button>MC</button>
            <button>MR</button>
            <button>M+</button>
            <button>M-</button>
            <button>MS</button>

            <!-- Hàng 2 -->
            <button>%</button>
            <button>CE</button>
            <button>C</button>
            <button>⌫</button>

            <!-- Hàng 3 -->
            <button>1/x</button>
            <button>x²</button>
            <button>√</button>
            <button>÷</button>

            <!-- Hàng số -->
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>

            <button>+/-</button>
            <button>0</button>
            <button>.</button>
            <button class="equal">=</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
