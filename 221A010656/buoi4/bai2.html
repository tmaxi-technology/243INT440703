<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Quản lý sinh viên</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f2f2f2;
    }

    h2 {
      color: #6D7E7F;
    }

    form, table {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 10px;
      color: #6D7E7F;
    }

    input, select {
      padding: 8px;
      width: 100%;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .radio-group {
      display: flex;
      gap: 15px;
      margin-top: 5px;
      color: #6D7E7F;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #A7B49E;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background-color: #8fa38a;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background-color: #6D7E7F;
      color: white;
    }

    #message {
      color: green;
      font-weight: bold;
      margin-bottom: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <h2>Nhập thông tin sinh viên</h2>
  <div id="message">✔ Thêm thành công!</div>
  <form id="studentForm">
    <label for="mssv">MSSV:</label>
    <input type="text" id="mssv" required>

    <label for="name">Họ tên:</label>
    <input type="text" id="name" required>

    <label for="email">Email:</label>
    <input type="email" id="email" required>

    <label>Giới tính:</label>
    <div class="radio-group">
      <label><input type="radio" name="gender" value="Nam" checked> Nam</label>
      <label><input type="radio" name="gender" value="Nữ"> Nữ</label>
    </div>

    <label for="birthplace">Nơi sinh:</label>
    <select id="birthplace" required>
      <option value="">-- Chọn --</option>
      <option value="TP.HCM">TP.HCM</option>
      <option value="Cần Thơ">Cần Thơ</option>
      <option value="Hà Nội">Hà Nội</option>
      <option value="Đà Nẵng">Đà Nẵng</option>
    </select>

    <button type="submit">Thêm vào danh sách</button>
  </form>

  <h2>Danh sách sinh viên</h2>
  <table id="studentTable">
    <thead>
      <tr>
        <th>MSSV</th>
        <th>Họ tên</th>
        <th>Email</th>
        <th>Giới tính</th>
        <th>Nơi sinh</th>
      </tr>
    </thead>
    <tbody id="tableBody">
    </tbody>
  </table>

  <script>
    const form = document.getElementById("studentForm");
    const tableBody = document.getElementById("tableBody");
    const message = document.getElementById("message");

    function showSuccessMessage() {
      message.style.display = 'block';
      setTimeout(() => {
        message.style.display = 'none';
      }, 2000);
    }

    function addStudentToTable(student) {
      const newRow = tableBody.insertRow();
      newRow.innerHTML = `
        <td>${student.mssv}</td>
        <td>${student.name}</td>
        <td>${student.email}</td>
        <td>${student.gender}</td>
        <td>${student.birthplace}</td>
      `;
    }

    function saveStudentsToStorage(students) {
      localStorage.setItem('students', JSON.stringify(students));
    }

    function loadStudentsFromStorage() {
      const stored = localStorage.getItem('students');
      if (stored) {
        const students = JSON.parse(stored);
        students.forEach(s => addStudentToTable(s));
      }
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const student = {
        mssv: document.getElementById("mssv").value,
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        gender: document.querySelector("input[name='gender']:checked").value,
        birthplace: document.getElementById("birthplace").value
      };

      addStudentToTable(student);

      const students = JSON.parse(localStorage.getItem('students') || '[]');
      students.push(student);
      saveStudentsToStorage(students);

      form.reset();
      showSuccessMessage();

      document.getElementById("studentTable").scrollIntoView({ behavior: 'smooth' });
    });

    loadStudentsFromStorage();
  </script>
</body>
</html>
