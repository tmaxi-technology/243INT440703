<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testimonial Slider</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container py-5">
  <div class="testimonial-container position-relative">
    
    <!-- Slider Items -->
    <div class="testimonial-slider">
      <div class="testimonial-item active">
        <div class="row align-items-center">
          <div class="col-md-6">
            <img src="images/vutru.jpg" alt="User" class="img-fluid rounded">
          </div>
          <div class="col-md-6">
            <blockquote class="blockquote">
              <p class="mb-4 fs-4 fw-bold">"Incredible services and amazing customer support"</p>
              <footer class="blockquote-footer">
                <span class="fw-bold text-warning">Joy Smith</span><br>
                <small class="text-muted">Project Manager</small>
              </footer>
            </blockquote>
          </div>
        </div>
      </div>

      <!-- testimonial-item khác  -->
       <!-- Slider Items -->
    <div class="testimonial-slider">
      <div class="testimonial-item active">
        <div class="row align-items-center">
          <div class="col-md-6">
            <img src="images/38.jpg" alt="User" class="img-fluid rounded">
          </div>
          <div class="col-md-6">
            <blockquote class="blockquote">
              <p class="mb-4 fs-4 fw-bold">"Incredible services and amazing customer support"</p>
              <footer class="blockquote-footer">
                <span class="fw-bold text-warning">Joy Smith</span><br>
                <small class="text-muted">Project Manager</small>
              </footer>
            </blockquote>
          </div>
        </div>
      </div>
       
    </div>

    <!-- Navigation -->
    <div class="testimonial-nav">
      <button class="prev-btn">←</button>
      <button class="next-btn">→</button>
    </div>

    <!-- Dots -->
    <div class="testimonial-dots text-center mt-4">
      <span class="dot active"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="slider.js"></script>

</body>
</html>
