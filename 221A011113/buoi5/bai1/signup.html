<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="container-box">
    <!-- Sign Up Form -->
    <div class="form-section">
      <h2>Sign up</h2>
      <form>
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-person-fill"></i> Họ tên</label>
          <input type="text" class="form-control" placeholder="John Doe">
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-envelope-fill"></i> Email</label>
          <input type="email" class="form-control" placeholder="Your Email">
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-lock-fill"></i> Mật khẩu</label>
          <input type="password" class="form-control" placeholder="Password">
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-lock-fill"></i> Nhập lại mật khẩu</label>
          <input type="password" class="form-control" placeholder="Repeat your password">
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="termsCheck">
          <label class="form-check-label" for="termsCheck">
            Tôi đồng ý với <a href="#">Điều khoản dịch vụ</a>
          </label>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Đăng ký</button>
      </form>
      <div class="switch-link mt-4">
        <a href="signin.html">Tôi đã có tài khoản</a>
      </div>
    </div>

    <!-- Image Section -->
    <div class="image-section d-none d-md-block">
      <div class="image-placeholder">[Hình ảnh minh họa - bạn thêm sau]</div>
    </div>
  </div>
</div>

</body>
</html>
