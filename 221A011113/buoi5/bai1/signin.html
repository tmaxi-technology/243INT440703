<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="container-box">
    <!-- Image Section -->
    <div class="image-section d-none d-md-block">
      <div class="image-placeholder">[Hình ảnh minh họa - bạn thêm sau]</div>
    </div>

    <!-- Sign In Form -->
    <div class="form-section">
      <h2>Sign in</h2>
      <form>
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-person-fill"></i> Họ tên</label>
          <input type="text" class="form-control" placeholder="John Doe">
        </div>
        <div class="mb-3">
          <label class="form-label"><i class="bi bi-lock-fill"></i> Mật khẩu</label>
          <input type="password" class="form-control" placeholder="Password">
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe">
          <label class="form-check-label" for="rememberMe">
            Ghi nhớ đăng nhập
          </label>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Đăng nhập</button>
      </form>

      <div class="social-icons mt-4">
        <span>Hoặc đăng nhập bằng:</span><br>
        <i class="bi bi-facebook text-primary"></i>
        <i class="bi bi-twitter text-info"></i>
        <i class="bi bi-google text-danger"></i>
      </div>

      <div class="switch-link mt-4">
        <a href="signup.html">Tạo tài khoản mới</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
